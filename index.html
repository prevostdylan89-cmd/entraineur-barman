<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0E241F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EEF0EA" media="(prefers-color-scheme: light)">
<meta name="description" content="Révise tes recettes de cocktails : quiz chronométré, flashcards et révision espacée.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Entraîneur barman</title>
<style>
:root{
  --bg:#EEF0EA; --surface:#F8F8F4; --surface-2:#E2E7DE; --ink:#13302A; --ink-2:#4D605A; --ink-3:#7A8A84;
  --brass:#8C6A1E; --brass-soft:rgba(140,106,30,.14); --on-brass:#FFF8E6;
  --line:rgba(19,48,42,.14); --line-2:rgba(19,48,42,.26);
  --ok:#2F7A45; --ok-soft:rgba(47,122,69,.13); --bad:#B3263E; --bad-soft:rgba(179,38,62,.12); --warn:#9A6A12;
  --shadow:0 1px 0 rgba(19,48,42,.06),0 8px 24px -12px rgba(19,48,42,.28);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L","Noto Serif",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --r-s:8px; --r-m:14px; --r-l:22px;
  --tabs-h:64px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E241F; --surface:#15322B; --surface-2:#1C3E35; --ink:#EDE4CF; --ink-2:#B9B29E; --ink-3:#8A8B7C;
    --brass:#D2A84E; --brass-soft:rgba(210,168,78,.16); --on-brass:#1E1708;
    --line:rgba(237,228,207,.13); --line-2:rgba(237,228,207,.24);
    --ok:#86BD92; --ok-soft:rgba(134,189,146,.14); --bad:#E8768A; --bad-soft:rgba(232,118,138,.14); --warn:#E1B25B;
    --shadow:0 1px 0 rgba(0,0,0,.25),0 10px 30px -14px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.15}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- Structure ---------- */
.app{min-height:100%;padding:env(safe-area-inset-top) 0 calc(var(--tabs-h) + env(safe-area-inset-bottom))}
.view{max-width:720px;margin:0 auto;padding:20px 18px 40px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;max-width:120px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 4px;border-radius:12px;color:var(--ink-3);font-size:12px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{color:var(--brass)}
@media (min-width:900px){
  .app{padding:0 0 0 220px}
  .tabs{top:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:28px 14px}
  .tabs::before{content:"Entraîneur barman";font-family:var(--serif);font-size:20px;font-weight:600;padding:0 10px 22px}
  .tab{flex-direction:row;max-width:none;gap:12px;font-size:15px;padding:10px 12px;justify-content:flex-start}
  .tab[aria-current="page"]{background:var(--brass-soft)}
  .view{padding:40px 32px 60px}
}

/* ---------- Éléments ---------- */
.page-title{font-size:30px;margin:4px 0 18px}
.section{margin-top:28px}
.section > h2{font-size:20px;margin-bottom:10px}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.tiny{font-size:12.5px;color:var(--ink-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:15px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--on-brass)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:50%;border:0;background:transparent}
.icon-btn svg{width:22px;height:22px}
.icon-btn:hover{background:var(--surface-2)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;min-width:44px}
.seg button[aria-pressed="true"]{background:var(--brass);color:var(--on-brass);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field > span{font-size:14px;color:var(--ink-2)}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{
  width:100%;min-height:44px;padding:10px 12px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--surface);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brass)}
textarea{min-height:84px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(var(--tabs-h) + 18px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:100;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:30px 16px;color:var(--ink-2)}
.empty h3{font-size:19px;color:var(--ink);margin-bottom:6px}

/* ---------- Accueil ---------- */
.service{position:relative;overflow:hidden;border-radius:var(--r-l);padding:22px 20px 20px;background:var(--surface);border:1px solid var(--line)}
.service .label{font-size:14px;color:var(--ink-2)}
.service .count{font-family:var(--serif);font-size:44px;line-height:1;margin:8px 0 4px}
.service .count small{font-family:var(--sans);font-size:15px;color:var(--ink-2);margin-left:6px}
.service .sub{color:var(--ink-2);font-size:14.5px;margin-bottom:16px}
.service .ribbon{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-2);font-size:14px;color:var(--ink-2)}
.service .ribbon b{color:var(--ink);font-weight:600}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:16px;display:flex;flex-direction:column;gap:6px;min-height:118px}
.mode svg{width:26px;height:26px;color:var(--brass)}
.mode b{font-family:var(--serif);font-size:18px;font-weight:600}
.mode span{font-size:13.5px;color:var(--ink-2)}

/* ---------- Liste recettes ---------- */
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink-3)}
.search input{padding-left:38px;border-radius:999px}
.list{list-style:none;margin:8px 0 0;padding:0}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:color-mix(in srgb,var(--surface-2) 50%,transparent)}
.item .glass{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--surface-2);color:var(--ink-2)}
.item .glass svg{width:22px;height:22px}
.item .nm{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.2}
.item .meta{font-size:13px;color:var(--ink-3)}
.item .tags{display:flex;gap:4px;align-items:center}
.dot-tag{font-size:11.5px;padding:2px 7px;border-radius:999px;background:var(--brass-soft);color:var(--ink)}
.mbar{width:56px;height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden;flex:none}
.mbar span{display:block;height:100%;background:var(--brass)}
.mbar.ok span{background:var(--ok)}
.mbar.bad span{background:var(--bad)}
.fab{position:fixed;right:18px;bottom:calc(var(--tabs-h) + 16px + env(safe-area-inset-bottom));z-index:15;height:54px;padding:0 20px 0 16px;border-radius:999px;
  border:0;background:var(--brass);color:var(--on-brass);font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.fab svg{width:22px;height:22px}
@media (min-width:900px){.fab{bottom:28px;right:32px}}

/* ---------- Fiche (spec) ---------- */
.spec{list-style:none;margin:0;padding:0}
.ing{padding:7px 0}
.ing-line{display:flex;align-items:baseline;gap:6px}
.ing-n{font-size:16px}
.lead{flex:1;border-bottom:2px dotted var(--line-2);transform:translateY(-4px);min-width:12px}
.ing-q{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.pour{height:6px;border-radius:6px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.pour span{display:block;height:100%;background:var(--brass);border-radius:6px;transform-origin:left;animation:pour .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes pour{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.ratio{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.ratio b{font-family:var(--serif);font-size:18px;color:var(--ink);letter-spacing:.04em}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fact{background:var(--surface-2);border-radius:var(--r-s);padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.fact svg{width:22px;height:22px;flex:none;color:var(--brass);margin-top:2px}
.fact .k{font-size:12.5px;color:var(--ink-2)}
.fact .v{font-size:14.5px;font-weight:600;line-height:1.3}
.fact.wide{grid-column:1/-1}
.note{margin-top:16px;font-family:var(--serif);font-size:16.5px;line-height:1.6;color:var(--ink-2);font-style:italic}

/* ---------- Calques (fiches, sessions) ---------- */
.layer{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);opacity:0;transform:translateY(16px);transition:opacity .2s,transform .25s}
.layer.in{opacity:1;transform:none}
@media (min-width:900px){
  .layer.sheet{background:rgba(5,15,12,.45);display:flex;justify-content:center;align-items:flex-start;padding:40px 20px}
  .layer.sheet .sheet-in{background:var(--bg);width:100%;max-width:640px;border-radius:var(--r-l);box-shadow:var(--shadow);border:1px solid var(--line)}
}
.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:8px 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sheet-head .t{flex:1;font-weight:600;font-size:15px;text-align:center;color:var(--ink-2)}
.sheet-body{padding:6px 20px 32px;max-width:640px;margin:0 auto}
.detail-name{font-size:34px;margin:4px 0 6px}
.detail-sub{color:var(--ink-2);font-size:14.5px;margin-bottom:18px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.toggle-row{display:flex;gap:10px;margin:14px 0 4px}
.toggle-row .btn{flex:1;min-height:42px;font-size:14px}
.btn[aria-pressed="true"]{background:var(--brass-soft);border-color:var(--brass)}
.progress-line{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:14px;color:var(--ink-2)}
.progress-line .mbar{width:90px}

/* Formulaire ingrédients */
.ing-edit{display:grid;grid-template-columns:1fr 78px 118px 40px;gap:6px;margin-bottom:8px;align-items:center}
.ing-edit input,.ing-edit select{min-height:42px;padding:8px}
@media (max-width:420px){.ing-edit{grid-template-columns:1fr 64px 96px 36px}}

/* ---------- Session ---------- */
.ses{min-height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:0 18px 20px}
.ses-top{display:flex;align-items:center;gap:8px;padding:8px 0}
.ses-top .count{flex:1;text-align:center;font-size:14px;color:var(--ink-2)}
.timer{height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-bottom:6px}
.timer span{display:block;height:100%;width:100%;background:var(--brass);transform-origin:left}
.timer.low span{background:var(--bad)}
.timer.off{visibility:hidden}
.ses-body{flex:1;display:flex;flex-direction:column;padding-top:18px}
.ses-kind{font-size:14px;color:var(--brass);font-weight:600}
.ses-name{font-size:36px;margin:6px 0 4px}
.ses-prompt{font-size:17px;color:var(--ink-2);margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-m);padding:14px 16px;font-size:16px;display:flex;gap:12px;align-items:flex-start;min-height:54px}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:12px;color:var(--ink-3);margin-top:1px}
.opt .spec-lines{display:flex;flex-direction:column;gap:2px;font-size:15px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.flipcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-l);padding:20px;min-height:220px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.flipcard.front{align-items:center;text-align:center;gap:10px;cursor:pointer}
.flipcard.front svg{width:56px;height:56px;color:var(--brass)}
.flipcard .hint{color:var(--ink-3);font-size:14px}
.flipcard.back{animation:flip .35s ease both}
@keyframes flip{from{transform:perspective(900px) rotateY(-80deg);opacity:0}to{transform:none;opacity:1}}
.answer-big{font-family:var(--serif);font-size:26px;margin-bottom:12px}
.ses-foot{padding-top:18px;display:flex;flex-direction:column;gap:10px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades .btn{border-radius:var(--r-m);flex-direction:column;gap:0;min-height:58px;font-size:15px}
.grades .btn small{font-weight:400;font-size:12px;opacity:.8}
.g0{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)!important}
.g1{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)!important}
.g2{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)!important}
.verdict{font-weight:700;margin:16px 0 8px}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--bad)}
.kbd{font-size:12px;color:var(--ink-3);text-align:center}
@media (pointer:coarse){.kbd{display:none}}

/* ---------- Progression ---------- */
.glass-meter{display:flex;gap:18px;align-items:center}
.glass-meter svg{width:130px;height:auto;flex:none}
.glass-meter .big{font-family:var(--serif);font-size:44px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--surface-2);border-radius:var(--r-s);padding:10px 12px}
.stat b{display:block;font-family:var(--serif);font-size:24px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--ink-2)}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:10px}
.days i{aspect-ratio:1;border-radius:4px;background:var(--surface-2)}
.days i.on{background:var(--brass)}
.days i.today{outline:1px solid var(--ink-2);outline-offset:1px}
.settings-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.set-row{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.set-row:last-child{border-bottom:0}
.set-row .lbl{font-weight:600}
.set-row .desc{font-size:13.5px;color:var(--ink-2)}
.limits{font-size:14.5px;color:var(--ink-2);padding-left:18px;margin:8px 0 0}
.limits li{margin-bottom:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="app">
  <main class="view" id="view" tabindex="-1"></main>
  <nav class="tabs" aria-label="Navigation principale">

    <button class="tab" data-a="tab" data-tab="recettes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>Recettes</button>
    <button class="tab" data-a="tab" data-tab="progres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progrès</button>

  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
/* =========================================================
   1. Référentiels
   ========================================================= */
const APP_VERSION = '1.0.0';
const KEY = 'entraineur-barman-v1';
const DAY = 864e5;

const CATS = {I:'IBA · Inoubliables', C:'IBA · Classiques contemporains', N:'IBA · Nouvelle ère', E:'Spec de l’école', P:'Recette perso'};

/* Doses */
function fmtMl(q, unit=S.settings.unit){
  if(unit==='ml') return dec(q,1)+' ml';
  if(unit==='oz'){
    const v=q/30, w=Math.floor(v+1e-9), f=v-w;
    const F=[[0,''],[1/4,'¼'],[1/3,'⅓'],[1/2,'½'],[2/3,'⅔'],[3/4,'¾'],[1,'']];
    let best=null; F.forEach(([x,s])=>{ if(Math.abs(f-x)<0.035) best=[x,s]; });
    if(best){ const whole = best[0]===1 ? w+1 : w; const txt=(whole? whole:'')+best[1]; return (txt||'0')+' oz'; }
    return dec(v)+' oz';
  }
  return dec(q/10)+' cl';
}
function fmtQ(i){
  if(i.u==='ml') return fmtMl(i.q);
  if(!i.q) return i.u;
  return frac(i.q)+' '+(i.q>1 && PLURAL[i.u] ? PLURAL[i.u] : i.u);
}
function toMl(v, unit=S.settings.unit){ const x=parseFloat(String(v).replace(',','.')); if(!isFinite(x)) return 0; const ml = unit==='cl'? x*10 : unit==='oz'? x*30 : x; return Math.round(ml*2)/2; }
function fromMl(q, unit=S.settings.unit){ if(!q) return ''; const v = unit==='cl'? q/10 : unit==='oz'? q/30 : q; return String(Math.round(v*100)/100).replace('.',','); }
function ratioStr(c){
  const v=c.ing.filter(i=>i.u==='ml'&&i.q>0).map(i=>i.q);
  if(v.length<2 || v.length>5) return '';
  const min=Math.min(...v);
  for(let k=1;k<=4;k++){
    const parts=v.map(x=>x/min*k);
    if(parts.every(p=>Math.abs(p-Math.round(p))<0.02) && Math.max(...parts)<=12) return parts.map(p=>Math.round(p)).join(' : ');
  }
  return '';
}

const live = () => S.cocktails.filter(c=>!c.deleted).sort((a,b)=>(a.rank??999)-(b.rank??999) || a.name.localeCompare(b.name,'fr'));
const byId = id => S.cocktails.find(c=>c.id===id);
const P = id => S.progress[id];

function mastery(id){
  const p=P(id); if(!p||!p.n) return 0;
  const h=p.h.slice(-5); const rec=h.reduce((a,g)=>a+g/2,0)/h.length;
  return Math.round(100*(0.6*rec + 0.4*Math.min(1,p.iv/21)));
}
const isNew = id => !P(id) || !P(id).n;
const isDue = id => { const p=P(id); return !!(p && p.n && p.due<=Date.now()); };
const toRework = id => { const p=P(id); return !!(p && p.n && (mastery(id)<60 || p.h[p.h.length-1]===0)); };

function grade(id, g){
  const p = P(id) || {ease:2.5, iv:0, due:0, reps:0, lapses:0, h:[], n:0, ok:0};
  const first = !p.n;
  if(g===0){ p.lapses++; p.reps=0; p.iv=0; p.ease=Math.max(1.3,p.ease-.2); p.due=Date.now()+10*60e3; }
  else if(g===1){ p.ease=Math.max(1.3,p.ease-.15); p.iv=Math.max(1,Math.round(p.iv*1.2)); p.due=today0()+p.iv*DAY; }
  else { p.reps++; p.iv = p.reps===1?1 : p.reps===2?3 : Math.max(p.iv+1, Math.round(p.iv*p.ease)); p.due=today0()+p.iv*DAY; }
  p.h.push(g); if(p.h.length>8) p.h.shift();
  p.n++; p.ok += g===2?1 : g===1?.5 : 0; p.last=Date.now(); p.updatedAt=Date.now();
  S.progress[id]=p;
  const k=dkey(); if(!S.days.includes(k)) S.days.push(k);
  if(first){ if(S.newDay.d!==k) S.newDay={d:k,n:0}; S.newDay.n++; }
  save();
}
function streak(){
  const set=new Set(S.days); let t=today0(), n=0;
  if(!set.has(dkey(t))) t-=DAY;
  while(set.has(dkey(t))){ n++; t-=DAY; }
  return n;
}
function newLeft(){ const used = S.newDay.d===dkey() ? S.newDay.n : 0; return Math.max(0, S.settings.newPerDay - used); }
function dueLabel(id){
  const p=P(id); if(!p||!p.n) return 'Jamais révisé';
  if(p.due<=Date.now()) return 'À réviser maintenant';
  const d=Math.round((p.due-today0())/DAY);
  return d<=0 ? 'Plus tard aujourd’hui' : d===1 ? 'Prochaine révision demain' : `Prochaine révision dans ${d} jours`;
}

function pool(sel=S.sel){
  let L=live();
  switch(sel.k){
    case 'essentiels': return L.filter(c=>c.essential);
    case 'fav': return L.filter(c=>c.fav);
    case 'semaine': return L.filter(c=>c.week);
    case 'rates': return L.filter(c=>toRework(c.id));
    case 'perso': return L.filter(c=>c.custom||c.edited);
    case 'famille': return L.filter(c=>c.fam===sel.fam);
  }
  return L;
}
const selLabel = () => S.sel.k==='famille' ? 'Famille '+(S.sel.fam||'') : (SELS.find(s=>s[0]===S.sel.k)||SELS[0])[1];
function reviewQueue(){
  const L=pool();
  const due=L.filter(c=>isDue(c.id)).sort((a,b)=>P(a.id).due-P(b.id).due).map(c=>c.id);
  const nw=L.filter(c=>isNew(c.id)).slice(0,newLeft()).map(c=>c.id);
  return [...due.slice(0,60), ...nw];
}

const layers=[];
function openLayer(cls, render, onClose, replace=false){
  if(replace && layers.length){ const old=layers.pop(); old.onClose && old.onClose(); old.el.remove(); }
  const el=document.createElement('div');
  el.className='layer '+cls; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true');
  document.body.appendChild(el);
  const L={el, onClose, refresh:null};
  layers.push(L);
  if(replace) history.replaceState({layer:layers.length},''); else history.pushState({layer:layers.length},'');
  render(el, L);
  requestAnimationFrame(()=>el.classList.add('in'));
  document.body.classList.add('locked');
  return L;
}
function closeTop(){ if(layers.length) history.back(); }
window.addEventListener('popstate',()=>{
  const L=layers.pop();
  if(L){ L.onClose && L.onClose(); L.el.remove(); }
  if(!layers.length) document.body.classList.remove('locked');
  const top=layers[layers.length-1]; if(top && top.refresh) top.refresh();
  renderTab();
});

/* =========================================================
   9. Questions
   ========================================================= */
const DOSES=[5,7.5,10,15,20,22.5,25,30,35,40,45,50,60,75,90,100,120];
function specText(ing){ return ing.map(i=>`${esc(i.n)} <b>${esc(fmtQ(i))}</b>`).join('<br>'); }
function specKey(ing){ return ing.map(i=>i.n+'|'+i.q+'|'+i.u).join(';'); }
function mutateDose(ing){
  const c=ing.map(i=>({...i})); const ml=c.filter(i=>i.u==='ml'&&i.q>0); if(!ml.length) return null;
  const t=pick(ml); const near=DOSES.filter(d=>d!==t.q).sort((a,b)=>Math.abs(a-t.q)-Math.abs(b-t.q)).slice(0,4);
  t.q=pick(near); return c;
}
function swapIng(ing, all){
  const c=ing.map(i=>({...i})); const names=new Set(c.map(i=>i.n));
  const pool=[...new Set(all.flatMap(x=>x.ing.map(i=>i.n)))].filter(n=>!names.has(n));
  if(!pool.length) return null; const i=Math.floor(Math.random()*c.length); c[i].n=pick(pool); return c;
}
function specOptions(c){
  const all=live(), seen=new Set([specKey(c.ing)]), out=[];
  const fams=all.filter(x=>x.id!==c.id && x.fam===c.fam && x.ing.length>=2);
  const tries=[()=>mutateDose(c.ing), ()=>swapIng(c.ing,all), ()=>fams.length?pick(fams).ing:null, ()=>{const m=mutateDose(c.ing); return m?mutateDose(m):null;}, ()=>{ const o=all.filter(x=>x.id!==c.id); return o.length? pick(o).ing : null; }];
  for(let k=0;k<40 && out.length<3;k++){
    const r=tries[k%tries.length](); if(!r) continue;
    const key=specKey(r); const txt=specText(r);
    if(seen.has(key) || out.some(o=>o.html===txt) || txt===specText(c.ing)) continue;
    seen.add(key); out.push({html:`<span class="spec-lines">${txt}</span>`, correct:false});
  }
  return shuffle([{html:`<span class="spec-lines">${specText(c.ing)}</span>`, correct:true}, ...out]);
}
function textOptions(correct, pool){
  const others=shuffle([...new Set(pool)].filter(x=>x && norm(x)!==norm(correct))).slice(0,3);
  return shuffle([{html:esc(correct),correct:true}, ...others.map(o=>({html:esc(o),correct:false}))]);
}
function applicable(c,t){
  if(t==='dose') return c.ing.some(i=>i.u==='ml'&&i.q>0);
  if(t==='garniture') return c.garnish && !/^aucune$/i.test(c.garnish.trim());
  return true;
}
function buildQ(c, type, fmt){
  const q={id:c.id, type, fmt, name:c.name};
  if(type==='spec'){ q.prompt='Quelle est la recette ?'; if(fmt==='qcm') q.options=specOptions(c); q.answer=''; }
  else if(type==='dose'){
    const ml=c.ing.filter(i=>i.u==='ml'&&i.q>0); const ing=pick(ml);
    q.prompt=`Combien de ${ing.n.toLowerCase()} ?`;
    const near=DOSES.filter(d=>d!==ing.q).sort((a,b)=>Math.abs(a-ing.q)-Math.abs(b-ing.q)).slice(0,5);
    const labels=new Set([fmtMl(ing.q)]); const opts=[];
    shuffle(near).forEach(d=>{ const l=fmtMl(d); if(opts.length<3 && !labels.has(l)){ labels.add(l); opts.push({html:esc(l),correct:false}); } });
    q.options=shuffle([{html:esc(fmtMl(ing.q)),correct:true}, ...opts]);
    q.answer=`${ing.n} : ${fmtMl(ing.q)}`;
  }
  else if(type==='verre'){ q.prompt='Dans quel verre se sert-il ?'; q.options=textOptions(c.glass,[...GLASSES,...live().map(x=>x.glass)]); q.answer=c.glass; }
  else if(type==='technique'){ q.prompt='Quelle technique ?'; q.options=textOptions(c.tech,[...TECHS,...live().map(x=>x.tech)]); q.answer=c.tech; }
  else { q.prompt='Quelle garniture ?'; q.options=textOptions(c.garnish, live().map(x=>x.garnish).filter(g=>!/^aucune/i.test(g||''))); q.answer=c.garnish; }
  return q;
}

/* =========================================================
   10. Sessions : révision, quiz, flashcards
   ========================================================= */
let SES=null, TICK=null;
function stopTimer(){ clearInterval(TICK); TICK=null; }

function weightedQueue(L, n){
  const items=L.map(c=>({id:c.id, w:1+(100-mastery(c.id))/20+(isDue(c.id)?2:0)+(isNew(c.id)?1:0)}));
  const out=[]; let bag=[...items];
  while(out.length<n){
    if(!bag.length) bag=[...items];
    const tot=bag.reduce((a,b)=>a+b.w,0); let r=Math.random()*tot, k=0;
    for(;k<bag.length;k++){ r-=bag[k].w; if(r<=0) break; }
    k=Math.min(k,bag.length-1);
    const it=bag.splice(k,1)[0];
    if(out[out.length-1]===it.id && items.length>1){ bag.push(it); continue; }
    out.push(it.id);
  }
  return out;
}

function startSession(kind, ids, opts={}, replace=false){
  if(!ids.length){ toast('Aucun cocktail à réviser dans cette sélection'); return; }
  const ses={kind, ids:[...ids], i:-1, res:[], opts, requeued:new Set()};
  openLayer('session', el=>{ SES=ses; SES.el=el; nextQ(); }, ()=>{ stopTimer(); if(SES===ses) SES=null; }, replace);
}
function nextQ(){
  stopTimer();
  SES.i++;
  if(SES.i>=SES.ids.length) return showResults();
  const c=byId(SES.ids[SES.i]);
  if(!c || c.deleted) return nextQ();
  SES.flipped=false; SES.answered=false; SES.timeout=false;
  if(SES.kind==='flash') return drawFlash();
  let type='spec', fmt='carte';
  if(SES.kind==='quiz'){
    const types=SES.opts.types.filter(t=>applicable(c,t)); type=types.length? pick(types) : 'spec';
    fmt = SES.opts.format==='mix' ? pick(['qcm','carte']) : SES.opts.format;
  }
  SES.q=buildQ(c,type,fmt);
  drawQ();
  const secs = SES.kind==='quiz' ? S.settings.timer*(type==='spec'?2:1) : 0;
  if(secs>0) startTimer(secs);
}
function sesTop(label){
  const n=SES.ids.length;
  return `<div class="ses-top"><button class="icon-btn" data-a="close" aria-label="Quitter">${I.x}</button><span class="count num">${Math.min(SES.i+1,n)} / ${n}</span><span style="width:44px"></span></div>
  <div class="timer ${SES.kind==='quiz'&&S.settings.timer?'':'off'}" id="tbar"><span></span></div>
  <p class="ses-kind">${label}</p>`;
}
function drawQ(){
  const q=SES.q, c=byId(q.id), el=SES.el;
  const label = SES.kind==='review' ? 'Révision du jour' : 'Quiz · '+QTYPES[q.type];
  let body;
  if(q.fmt==='qcm'){
    body=`<div class="opts" role="group" aria-label="Réponses">${q.options.map((o,i)=>`<button class="opt" data-a="pickOpt" data-i="${i}"><span class="k">${i+1}</span><span>${o.html}</span></button>`).join('')}</div>
    <div id="after"></div>`;
  } else if(!SES.flipped){
    body=`<div class="flipcard front" data-a="flip" role="button" tabindex="0">${glassIcon(c.glass)}<p class="hint">Réponds dans ta tête, à voix haute ou sur papier, puis retourne la carte.</p></div>
    <div class="ses-foot"><button class="btn primary block" data-a="flip">Retourner la carte</button><p class="kbd">Espace pour retourner</p></div>`;
  } else {
    body=`<div class="flipcard back">${q.type!=='spec'&&q.answer?`<p class="answer-big">${esc(q.answer)}</p>`:''}${specHTML(c)}${factsHTML(c)}</div>
    <div class="ses-foot">${SES.timeout?'<p class="verdict ko">Temps écoulé</p>':''}<p class="small muted">Avais-tu juste ?</p>
    <div class="grades"><button class="btn g0" data-a="grade" data-g="0">Raté<small>revient vite</small></button><button class="btn g1" data-a="grade" data-g="1">Hésitant<small>revient bientôt</small></button><button class="btn g2" data-a="grade" data-g="2">Juste<small>s’espace</small></button></div>
    <p class="kbd">Touches 1, 2, 3</p></div>`;
  }
  el.innerHTML=`<div class="ses">${sesTop(label)}<div class="ses-body"><h2 class="ses-name">${esc(c.name)}</h2><p class="ses-prompt">${esc(q.prompt)}</p>${body}</div></div>`;
}
function startTimer(secs){
  SES.timeout=false;
  const end=Date.now()+secs*1000, total=secs*1000;
  const tick=()=>{
    const bar=$('#tbar span'); const left=end-Date.now();
    if(bar){ bar.style.transform=`scaleX(${Math.max(0,left/total)})`; $('#tbar').classList.toggle('low', left<total*.25); }
    if(left<=0){ stopTimer(); SES.timeout=true;
      if(SES.q.fmt==='qcm') pickOpt(-1); else flip(); }
  };
  tick(); TICK=setInterval(tick,100);
}
function flip(){ if(!SES||SES.flipped||SES.q.fmt!=='carte') return; stopTimer(); SES.flipped=true; drawQ(); }
function pickOpt(i){
  if(!SES || SES.answered) return;
  stopTimer(); SES.answered=true;
  const q=SES.q, ok = i>=0 && q.options[i].correct;
  SES.el.querySelectorAll('.opt').forEach((b,k)=>{ b.disabled=true; const o=q.options[k]; b.classList.add(o.correct?'right': k===i?'wrong':'dim'); });
  const g= ok?2:0; record(g);
  const c=byId(q.id);
  $('#after',SES.el).innerHTML=`<p class="verdict ${ok?'ok':'ko'}">${ok?'Bonne réponse':(i<0?'Temps écoulé':'Pas tout à fait')}</p>
    <div class="card">${specHTML(c)}<p class="tiny" style="margin-top:10px">${esc(c.glass)} · ${esc(c.tech)} · ${esc(c.ice)} · ${esc(c.garnish)}</p></div>
    <div class="ses-foot"><button class="btn primary block" data-a="next" id="nextBtn">${SES.i+1>=SES.ids.length?'Voir le résultat':'Question suivante'}</button><p class="kbd">Entrée pour continuer</p></div>`;
  $('#nextBtn').focus({preventScroll:true});
  const af=$('#after',SES.el); if(af && af.scrollIntoView) af.scrollIntoView({behavior:'smooth',block:'start'});
}
function record(g){
  const id=SES.q.id;
  grade(id,g);
  SES.res.push({id, g, type:SES.q.type});
  if(SES.kind==='review' && g===0 && !SES.requeued.has(id)){ SES.requeued.add(id); SES.ids.push(id); }
}
function showResults(){
  stopTimer(); SES.q=null;
  const r=SES.res, n=r.length;
  const score = n? Math.round(r.reduce((a,x)=>a+x.g/2,0)/n*100) : 0;
  const missed=[...new Set(r.filter(x=>x.g<2).map(x=>x.id))];
  const title = SES.kind==='review' ? 'Révision terminée' : 'Quiz terminé';
  const msg = score>=90?'Prêt pour le service.': score>=70?'Solide. Quelques specs à resserrer.': score>=40?'Ça rentre. Les ratés reviendront plus souvent.':'Normal au début : la répétition espacée va faire le travail.';
  SES.el.innerHTML=`<div class="ses"><div class="ses-top"><button class="icon-btn" data-a="close" aria-label="Fermer">${I.x}</button><span class="count">${title}</span><span style="width:44px"></span></div>
  <div class="ses-body">
    <p class="ses-kind">${plural(n,'réponse')}</p>
    <h2 class="ses-name num">${score} %</h2>
    <p class="ses-prompt">${msg}</p>
    ${missed.length?`<h3 style="font-size:19px;margin:8px 0 4px">À retravailler</h3><ul class="list">${missed.map(id=>byId(id)).filter(Boolean).map(itemHTML).join('')}</ul>`:''}
    <div class="ses-foot">
      ${missed.length&&SES.kind==='quiz'?`<button class="btn primary block" data-a="retryMissed">Rejouer les ${plural(missed.length,'raté')}</button>`:''}
      <button class="btn block" data-a="close">Terminer</button>
    </div>
  </div></div>`;
  SES.missed=missed;
}

/* Flashcards */
function drawFlash(){
  const c=byId(SES.ids[SES.i]), el=SES.el, n=SES.ids.length;
  const card = SES.flipped
    ? `<div class="flipcard back" data-a="flip" id="fc">${specHTML(c)}${factsHTML(c)}${c.note?`<p class="note">${esc(c.note)}</p>`:''}</div>`
    : `<div class="flipcard front" data-a="flip" id="fc" role="button" tabindex="0">${glassIcon(c.glass)}<p class="hint">Touche pour voir la fiche</p></div>`;
  el.innerHTML=`<div class="ses"><div class="ses-top"><button class="icon-btn" data-a="close" aria-label="Quitter">${I.x}</button><span class="count num">${SES.i+1} / ${n}</span><button class="icon-btn" data-a="fav" data-id="${c.id}" style="color:var(--brass)" aria-label="Favori">${c.fav?I.starFill:I.star}</button></div>
  <div class="timer off"><span></span></div>
  <div class="ses-body"><p class="ses-kind">Flashcards · ${esc(selLabel())}</p><h2 class="ses-name">${esc(c.name)}</h2><p class="ses-prompt">${esc(c.fam||'')}</p>${card}
  <div class="ses-foot"><div class="row"><button class="btn grow" data-a="fprev" ${SES.i===0?'disabled':''}>Précédent</button><button class="btn primary grow" data-a="fnext">${SES.i+1>=n?'Terminer':'Suivant'}</button></div><p class="kbd">Flèches pour naviguer, espace pour retourner</p></div></div></div>`;
  const fc=$('#fc',el); let x0=null;
  fc.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  fc.addEventListener('touchend',e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>60){ e.preventDefault(); dx<0? flashMove(1) : flashMove(-1); } });
}
function flashMove(d){
  if(!SES) return;
  if(d>0 && SES.i+1>=SES.ids.length){ closeTop(); toast('Paquet terminé'); return; }
  SES.i=Math.max(0,SES.i+d); SES.flipped=false; drawFlash();
}

/* Configuration du quiz */
function openQuizSetup(ids){
  const st={types:[...S.settings.types], format:S.settings.format};
  const L=ids? ids.map(byId).filter(Boolean) : pool();
  openLayer('sheet', el=>{
    const draw=()=>{
      el.innerHTML=`<div class="sheet-in"><div class="sheet-head"><button class="icon-btn" data-a="close" aria-label="Fermer">${I.x}</button><span class="t">Quiz chronométré</span><span style="width:44px"></span></div>
      <div class="sheet-body">
        <p class="muted" style="margin-bottom:18px">${plural(L.length,'cocktail')} · ${ids?'cocktails à retravailler':esc(selLabel())}. Les cocktails faibles ou dus sortent plus souvent.</p>
        <div class="field"><span>Types de questions</span><div class="chips" style="flex-wrap:wrap">${Object.entries(QTYPES).map(([k,l])=>`<button class="chip" data-a="qt" data-k="${k}" aria-pressed="${st.types.includes(k)}">${l}</button>`).join('')}</div></div>
        <div class="field"><span>Format</span><div class="seg">${[['qcm','QCM'],['carte','Carte à retourner'],['mix','Mélange']].map(([v,l])=>`<button data-a="qf" data-v="${v}" aria-pressed="${st.format===v}">${l}</button>`).join('')}</div></div>
        <div class="field"><span>Chrono</span>${seg('timer',[[0,'Sans'],[10,'10 s'],[15,'15 s'],[20,'20 s'],[30,'30 s']],S.settings.timer)}</div>
        <div class="field"><span>Nombre de questions</span>${seg('len',[[10,'10'],[20,'20'],[30,'30']],S.settings.len)}</div>
        <button class="btn primary block" data-a="goQuiz" ${st.types.length&&L.length?'':'disabled'} style="margin-top:10px">Lancer le quiz</button>
      </div></div>`;
    };
    el._st=st; el._draw=draw; el._ids=L.map(c=>c.id); draw();
  });
}

/* =========================================================
   11. Export / import
   ========================================================= */
async function exportData(){
  const data={app:'entraineur-barman', v:1, exportedAt:new Date().toISOString(), cocktails:S.cocktails, progress:S.progress, days:S.days, newDay:S.newDay, settings:S.settings};
  const name=`entraineur-barman-${dkey()}.json`;
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Sauvegarde Entraîneur barman'}); toast('Sauvegarde partagée'); return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
  toast('Fichier téléchargé');
}
function mergeData(inc){
  if(!inc || inc.app!=='entraineur-barman' || !Array.isArray(inc.cocktails)) throw new Error('format');
  let added=0, updated=0;
  inc.cocktails.forEach(c=>{
    if(!c || !c.id || !c.name || !Array.isArray(c.ing)) return;
    const k=S.cocktails.findIndex(x=>x.id===c.id);
    if(k<0){ S.cocktails.push(c); added++; }
    else if((c.updatedAt||0) > (S.cocktails[k].updatedAt||0)){ S.cocktails[k]=c; updated++; }
  });
  let prog=0;
  Object.entries(inc.progress||{}).forEach(([id,p])=>{
    if(!p || !Array.isArray(p.h)) return;
    const cur=S.progress[id];
    if(!cur || (p.updatedAt||0)>(cur.updatedAt||0)){ S.progress[id]=p; prog++; }
  });
  S.days=[...new Set([...S.days, ...(inc.days||[])])].sort();
  if(inc.settings && (inc.settings.updatedAt||0)>(S.settings.updatedAt||0)) S.settings=Object.assign({},DEFAULT_SETTINGS,inc.settings);
  save();
  return {added, updated, prog};
}
$('#importFile').addEventListener('change', async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const r=mergeData(JSON.parse(await f.text()));
    toast(`Import terminé : ${r.added} ajoutés, ${r.updated} mis à jour, ${r.prog} progressions`);
    renderTab();
  }catch(err){ toast('Ce fichier n’est pas une sauvegarde Entraîneur barman'); }
});

/* =========================================================
   12. Actions
   ========================================================= */
function setSetting(k,v){
  const num=['timer','len','newPerDay']; S.settings[k]= num.includes(k)? Number(v) : v;
  S.settings.updatedAt=Date.now(); save();
}
const A = {
  tab:b=>setTab(b.dataset.tab),
  close:()=>closeTop(),
  sel:b=>{ S.sel={k:b.dataset.k, fam:S.sel.fam}; if(S.sel.k==='famille' && !S.sel.fam) S.sel.fam=(live()[0]||{}).fam; save(); renderTab(); },
  rf:b=>{ RF.k=b.dataset.k; document.querySelectorAll('[data-a="rf"]').forEach(x=>x.setAttribute('aria-pressed',x===b)); drawList(); },
  open:b=>openDetail(b.dataset.id),
  add:()=>openEdit(null),
  edit:b=>openEdit(b.dataset.id),
  fav:b=>{ const c=byId(b.dataset.id); c.fav=!c.fav; c.updatedAt=Date.now(); save(); toast(c.fav?'Ajouté aux favoris':'Retiré des favoris');
           if(SES && SES.kind==='flash') drawFlash(); else { const t=layers[layers.length-1]; t&&t.refresh&&t.refresh(); } },
  week:b=>{ const c=byId(b.dataset.id); c.week=!c.week; c.updatedAt=Date.now(); save(); toast(c.week?'Ajouté à la semaine à l’école':'Retiré de la semaine à l’école'); const t=layers[layers.length-1]; t&&t.refresh&&t.refresh(); },
  clearWeek:()=>{ if(!confirm('Retirer tous les cocktails de la semaine à l’école ?')) return; live().filter(c=>c.week).forEach(c=>{c.week=false;c.updatedAt=Date.now();}); save(); drawList(); toast('Semaine vidée'); },
  del:b=>{ const c=byId(b.dataset.id); if(!confirm(`Supprimer « ${c.name} » ?`+(c.custom?'':'\nTu pourras la restaurer depuis les réglages.'))) return;
           c.deleted=true; c.updatedAt=Date.now(); save(); toast('Fiche supprimée'); closeTop(); },
  revert:b=>{ const c=byId(b.dataset.id), s=SEED.find(x=>x.id===c.id); if(!s||!confirm('Remplacer ta version par la spec IBA d’origine ?')) return;
           Object.assign(c, JSON.parse(JSON.stringify(s)), {edited:false, updatedAt:Date.now()}); save(); toast('Spec IBA rétablie'); layers[layers.length-1].refresh(); },
  drill:b=>startSession('quiz',[b.dataset.id,b.dataset.id,b.dataset.id],{types:['spec','dose','verre','technique','garniture'],format:'mix'}),
  ingAdd:b=>{ const el=b.closest('.layer'); $('#ings',el).insertAdjacentHTML('beforeend', el._row({n:'',q:0,u:'ml'})); const rows=el.querySelectorAll('.in-n'); rows[rows.length-1].focus(); },
  ingDel:b=>{ const r=b.closest('.ing-edit'); if(r.parentElement.children.length>1) r.remove(); else r.querySelectorAll('input').forEach(i=>i.value=''); },
  saveEdit:b=>saveEdit(b.closest('.layer')),
  startReview:()=>startSession('review', reviewQueue()),
  startFlash:()=>startSession('flash', shuffle(pool().map(c=>c.id))),
  quizSetup:()=>openQuizSetup(null),
  quizRework:()=>openQuizSetup(live().filter(c=>toRework(c.id)).map(c=>c.id)),
  qt:b=>{ const el=b.closest('.layer'), st=el._st, k=b.dataset.k; st.types = st.types.includes(k)? st.types.filter(x=>x!==k) : [...st.types,k]; el._draw(); },
  qf:b=>{ const el=b.closest('.layer'); el._st.format=b.dataset.v; el._draw(); },
  goQuiz:b=>{ const el=b.closest('.layer'), st=el._st, L=el._ids.map(byId).filter(c=>c&&!c.deleted);
              S.settings.types=st.types; S.settings.format=st.format; S.settings.updatedAt=Date.now(); save();
              const ids=weightedQueue(L, S.settings.len); startSession('quiz',ids,{types:st.types,format:st.format},true); },
  set:b=>{ setSetting(b.dataset.k,b.dataset.v); const el=b.closest('.layer'); if(el && el._draw) el._draw(); else renderTab(); },
  flip:()=>{ if(!SES) return; if(SES.kind==='flash'){ SES.flipped=!SES.flipped; drawFlash(); } else flip(); },
  grade:b=>{ if(!SES||!SES.flipped) return; record(Number(b.dataset.g)); nextQ(); },
  pickOpt:b=>pickOpt(Number(b.dataset.i)),
  next:()=>nextQ(),
  fprev:()=>flashMove(-1), fnext:()=>flashMove(1),
  retryMissed:()=>{ const m=SES.missed, o=SES.opts; startSession('quiz', weightedQueue(m.map(byId).filter(Boolean), Math.max(m.length, Math.min(10,m.length*2))), o, true); },
  export:()=>exportData(),
  import:()=>$('#importFile').click(),
  restore:()=>{ let n=0; S.cocktails.forEach(c=>{ if(c.deleted && SEED.some(s=>s.id===c.id)){ c.deleted=false; c.updatedAt=Date.now(); n++; } }); save(); renderTab(); toast(plural(n,'recette restaurée','recettes restaurées')); },
  resetProgress:()=>{ if(!confirm('Effacer toute ta progression ? Les recettes restent.')) return; S.progress={}; S.days=[]; S.newDay={d:'',n:0}; save(); renderTab(); toast('Progression remise à zéro'); },
  wipe:()=>{ if(!confirm('Tout effacer sur cet appareil ? Cette action est définitive.')) return; localStorage.removeItem(KEY); S=load(); save(); renderTab(); toast('Données effacées'); }
};
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-a]'); if(!b || b.disabled) return;
  const f=A[b.dataset.a]; if(f){ f(b,e); }
});
document.addEventListener('change', e=>{
  if(e.target.id==='famSel'){ S.sel.fam=e.target.value; save(); renderTab(); }
  if(e.target.id==='sStart'){ setSetting('schoolStart', e.target.value); }
  if(e.target.id==='sEnd'){ setSetting('schoolEnd', e.target.value); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && layers.length){ closeTop(); return; }
  if(e.target.matches('input,textarea,select')) return;
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[role="button"][data-a]')){ e.preventDefault(); e.target.click(); return; }
  if(!SES) return;
  if(SES.kind==='flash'){
    if(e.key==='ArrowRight') flashMove(1); else if(e.key==='ArrowLeft') flashMove(-1); else if(e.key===' '){ e.preventDefault(); SES.flipped=!SES.flipped; drawFlash(); }
    return;
  }
  if(!SES.q) return;
  if(SES.q.fmt==='qcm'){
    if(!SES.answered && /^[1-4]$/.test(e.key) && SES.q.options[+e.key-1]) pickOpt(+e.key-1);
    else if(SES.answered && e.key==='Enter'){ e.preventDefault(); nextQ(); }
  } else {
    if(!SES.flipped && e.key===' '){ e.preventDefault(); flip(); }
    else if(SES.flipped && /^[1-3]$/.test(e.key)){ record(+e.key-1); nextQ(); }
  }
});

/* =========================================================
   13. Démarrage
   ========================================================= */
save();
renderTab();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
